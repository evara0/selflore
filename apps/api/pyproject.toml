[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.141.1",
    "fsrs>=6,<7",
    "psycopg[binary]>=3.2,<4",
    "tzdata>=2026.4",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
