    {n:'005',title:'什么是机会成本？',topic:'科学与思考',tag:'思维工具',color:'green',text:'选择一件事时，机会成本指什么？',answer:'机会成本是为了该选择而放弃的最佳替代方案的价值。它提醒我们同时考虑放弃了什么。'},
    {n:'006',title:'费曼学习法的提醒',topic:'科学与思考',tag:'思维工具',color:'blue',text:'把概念讲给初学者时，为什么能发现理解中的空白？',answer:'解释需要把概念、关系和例子组织起来。说不清的地方往往需要进一步查证和理解。'},
    {n:'010',title:'收录材料，再形成自己的理解',topic:'阅读材料',tag:'资料卡',color:'purple',text:'先保留出处和原始材料，再用自己的观点引用它。',answer:'原材料与个人说明分开展示。',reference:true}
  ];
  const opinions=[{n:'007',title:'笔记的价值在于连接',topic:'知识管理',tag:'卡片笔记',color:'purple',text:'一张笔记不必容纳所有信息。把一个想法说清楚，再连接已有知识，能让它持续生长。',answer:'主动回忆提醒我：笔记也应帮助我重新思考，而不只是储存文字。',opinion:true,links:2},{n:'008',title:'让阅读留下自己的问题',topic:'知识管理',tag:'卡片笔记',color:'blue',text:'读完一段内容后，先写下自己的问题，再整理答案。问题让阅读从接收转向探索。',answer:'这与费曼学习法的解释过程相呼应，也能连接到笔记的连接。',opinion:true,links:2},{n:'009',title:'给思考留一点空白',topic:'日常思考',tag:'卡片笔记',color:'orange',text:'有时不急着把所有笔记归类，反而能发现意外的连接。让结构随着理解慢慢形成。',answer:'定期回看待整理的想法，让结构随着理解慢慢形成。',opinion:true,links:0}];
  let page='knowledge',type='knowledge',query='',topic='',collection=false,detail=null,revealed=new Set();
  function cardHTML(c){return `<article class="sl-card sl-${c.color}"><div class="sl-card-meta"><span>${c.topic} · ${c.opinion?'观点':c.reference?'资料':c.kind||'问答'}</span><button class="sl-bookmark" aria-label="收藏 ${c.title}" aria-pressed="${!!c.bookmarked}" data-bookmark="${c.n}">◇</button></div><button class="sl-card-title" data-detail="${c.n}">${c.title}</button><p class="sl-card-excerpt">${c.text}</p>${revealed.has(c.n)?`<div class="sl-card-answer">${c.answer}</div>`:''}<div class="sl-card-bottom"><span class="sl-tag">${c.tag}</span>${c.opinion?`<button class="sl-reveal" data-detail="${c.n}">${c.links} 个连接 ↗</button>`:`<button class="sl-reveal" data-${c.reference?'detail':'reveal'}="${c.n}">${c.reference?'阅读资料':revealed.has(c.n)?'收起答案':'查看答案'} ↗</button>`}</div><div class="sl-card-code">示例 ${c.n}<span class="sl-checker" aria-hidden="true"></span></div></article>`}
  function sidebar(){return `<aside class="sl-sidebar"><div class="sl-side-label">${page==='opinions'?'我的卡片盒':page==='collections'?'我的合集':'我的知识库'}</div><button class="sl-side-btn sl-active" data-topic="">全部${page==='opinions'?'观点':page==='collections'?'合集':'知识'}<span>${page==='opinions'?'03':page==='collections'?'02':'07'}</span></button><button class="sl-side-btn" data-filter="favorite">我的收藏<span>◇</span></button><button class="sl-side-btn" data-filter="archive">已归档<span>—</span></button><hr><div class="sl-side-label">分类</div>${(page==='opinions'?['知识管理','日常思考']:page==='collections'?['学习与思考入门','日常思维工具']:['学习方法','科学与思考','阅读材料']).map((t,i)=>`<button class="sl-side-btn" data-topic="${t}">${t}<span>${page==='collections'?'05':i===2?'01':page==='opinions'?i===0?'02':'01':'03'}</span></button>`).join('')}<hr><button class="sl-side-new" data-notice="新建需要登录；此处为主题设计预览。">＋ 新建${page==='opinions'?'原子观点':page==='collections'?'合集':'知识卡片'}</button>${page==='knowledge'?'<button class="sl-side-new" data-notice="新建需要登录；此处为主题设计预览。">＋ 新建资料卡</button>':''}<div class="sl-side-note"><span class="sl-small-flower" aria-hidden="true">✳</span><h3>${page==='opinions'?'思考，在连接中生长。':'记住，更要理解。'}</h3><p>${page==='opinions'?'把想法写成自己的语言，并为它找到下一个连接。':'先尝试主动回忆，再揭示答案。小步积累，自有回响。'}</p></div></aside>`}
  function heading(title,en,desc,action){return `<div class="sl-heading"><div><div class="sl-kicker">${en}</div><h1>${title}</h1><p>${desc}</p></div>${action||''}</div>`}
  function collectionsHTML(){return `<div class="sl-collection-grid"><article class="sl-card sl-green sl-collection" data-read="learning" role="button" tabindex="0" aria-label="翻阅学习与思考入门"><div class="sl-card-meta"><span>COLLECTION · 01</span><span>◇</span></div><div class="sl-cover-art" aria-hidden="true"></div><button class="sl-card-title" data-read="learning">学习与思考入门</button><p class="sl-card-excerpt">从知识到观点，体验一段混合卡片阅读。</p><div class="sl-card-bottom"><span>5 张卡片 · 3 知识 / 2 观点</span><button class="sl-reveal" data-read="learning">翻阅 ↗</button></div></article><article class="sl-card sl-orange sl-collection" data-read="tools" role="button" tabindex="0" aria-label="翻阅日常思维工具"><div class="sl-card-meta"><span>COLLECTION · 02</span><span>◇</span></div><div class="sl-cover-art sl-geometry" aria-hidden="true"></div><button class="sl-card-title" data-read="tools">日常思维工具</button><p class="sl-card-excerpt">用几个问题，重新看看日常的选择与判断。</p><div class="sl-card-bottom"><span>5 张卡片 · 3 知识 / 1 观点 / 1 资料</span><button class="sl-reveal" data-read="tools">翻阅 ↗</button></div></article></div>`}
  function renderDetail(){const c=detail;return `<button class="sl-back" data-back="true">← 返回${collection?'合集':page==='opinions'?'观点':'知识'}</button>${collection?heading('学习与思考入门','COLLECTION / READER','5 张卡片 · 3 知识 / 2 观点',''):''}<div class="sl-detail-layout"><article class="sl-card sl-${c.color} sl-detail"><div class="sl-card-meta"><span>${c.opinion?'观点卡片':c.reference?'资料卡':'知识卡片'} · ${c.kind||'问答'}</span><button class="sl-bookmark" aria-label="收藏卡片" data-bookmark="${c.n}" aria-pressed="${!!c.bookmarked}">◇</button></div><h1>${c.title}</h1><div class="sl-detail-code">示例-${c.n}</div><div class="sl-detail-tags"><span class="sl-tag">${c.topic}</span><span class="sl-tag">${c.tag}</span></div><div class="sl-question"><span class="sl-label">${c.opinion?'THOUGHT / 观点':c.reference?'REFERENCE / 资料':'QUESTION / 问题'}</span><p>${c.text}</p></div>${revealed.has(c.n)||c.opinion||c.reference?`<div class="sl-answer-area"><span class="sl-label">${c.opinion?'CONNECTION / 连接':c.reference?'NOTE / 我的说明':'ANSWER / 答案'}</span><p>${c.answer}</p></div>`:''}${!c.opinion&&!c.reference?`<button class="sl-detail-reveal" data-reveal="${c.n}">${revealed.has(c.n)?'隐藏答案':'显示答案'}　${revealed.has(c.n)?'↑':'↓'}</button>`:''}<div class="sl-detail-actions"><button data-notice="编辑卡片需要登录；此处为主题设计预览。">编辑卡片 ↗</button><button data-notice="归档需要登录；此处为主题设计预览。">归档</button><button data-notice="此处为主题设计预览，不操作实际卡片。">移入回收站</button></div><div class="sl-card-code">SELFLORE · ${c.n}<span class="sl-checker" aria-hidden="true"></span></div></article><aside class="sl-related"><h3>反向链接 <small>01</small></h3><p>从这里，遇见下一段思考。</p>${cardHTML(opinions[0])}<h3>关联卡片 <small>00</small></h3><p>这张卡片暂无主动关联。</p></aside></div>${collection?'<div class="sl-pagination"><button disabled>← 上一张</button><span>1 / 5</span><button data-detail="003">下一张 →</button></div>':''}`}
  function render(){root.querySelectorAll('.sl-nav button').forEach(b=>b.classList.toggle('sl-current',b.dataset.page===page));if(detail){body.innerHTML=renderDetail();return;}if(page==='profile'){body.innerHTML=heading('演示账号','PERSONAL / HOME','这是只读演示资料，登录后开始建立自己的空间。','')+`<div class="sl-profile-summary"><span><b>6</b>知识</span><span><b>3</b>观点</span><span><b>1</b>资料</span><span><b>2</b>合集</span><span><b>3</b>连续学习天数</span></div><h2 class="sl-profile-label">十二周学习足迹</h2><div class="sl-heatmap" aria-label="示例学习足迹">${Array.from({length:84},(_,i)=>`<div class="${i%5===0||i%3===0?'sl-grown':''}" aria-label="示例学习记录"></div>`).join('')}</div><h2 class="sl-profile-label" style="margin-bottom:24px">置顶合集</h2>${collectionsHTML()}`;return;}const opinion=page==='opinions',isCollection=page==='collections';body.innerHTML=heading(isCollection?'合集':opinion?'观点':'知识',isCollection?'COLLECTIONS / INDEX':opinion?'THOUGHTS / INDEX':'KNOWLEDGE / INDEX',isCollection?'把散落的卡片串起来，在翻阅中遇见新的连接。':opinion?'一个想法，一张卡片。让独立的思考彼此连接。':'让每一次回忆，都成为更牢固的理解。',`<button class="sl-primary" ${isCollection||opinion?'data-notice="此处为主题设计预览，新建需要登录。"':'data-detail="001"'}>${isCollection?'＋ 新建合集':opinion?'＋ 写下观点':'开始复习　→'}</button>`)+`<div class="sl-workspace">${sidebar()}<section class="sl-content">${!isCollection&&!opinion?'<div class="sl-review-strip"><div class="sl-review-item"><small>今日目标</small><strong>5</strong><em> / 20 个复习单元</em><div class="sl-progress"><span></span></div></div><div class="sl-review-item"><small>待复习</small><strong>3</strong><em>个复习单元</em></div><div class="sl-review-item"><small>已掌握</small><strong>2</strong><em>张卡片</em></div><span class="sl-strip-ornament" aria-hidden="true">✳</span></div>':''}<div class="sl-tools"><label class="sl-search"><span aria-hidden="true">⌕</span><input id="sl-search-input" aria-label="搜索卡片" placeholder="${isCollection?'搜索合集…':opinion?'搜索观点、关键词…':'搜索资料、知识、作者或关键词…'}" value="${query}"></label>${!isCollection?'<select aria-label="标签" id="sl-tag"><option value="">全部标签</option><option>主动回忆</option><option>思维工具</option><option>卡片笔记</option></select><select aria-label="排序" id="sl-sort"><option value="code">编号顺序</option><option value="recent">最近更新</option></select>':''}</div>${isCollection?collectionsHTML():`<div class="sl-tabs">${opinion?'<span>全部观点</span>':[['all','全部'],['reference','资料'],['knowledge','事实知识']].map(([value,label])=>`<button class="${type===value?'sl-selected':''}" data-type="${value}">${label}</button>`).join('')}<span class="sl-total" id="sl-total"></span></div><div class="sl-grid" id="sl-grid"></div><div class="sl-pagination"><span>←</span><span>01</span><span>→</span></div>`}</section></div>`;if(!isCollection)renderCards();}
  function renderCards(){let list=(page==='opinions'?opinions:cards).filter(c=>(page==='opinions'||type==='all'||(type==='reference'?c.reference:!c.reference))&&(!topic||c.topic===topic)&&(!query||`${c.title}${c.text}${c.tag}`.includes(query)));const tag=root.querySelector('#sl-tag')?.value;if(tag)list=list.filter(c=>c.tag===tag);if(root.querySelector('#sl-sort')?.value==='recent')list.reverse();root.querySelector('#sl-grid').innerHTML=list.map(cardHTML).join('')||'<p>没有匹配的卡片。</p>';root.querySelector('#sl-total').textContent=`${list.length} 张卡片 · 示例内容`;}
  root.addEventListener('click',e=>{const b=e.target.closest('button,[data-read]');if(!b)return;if(b.dataset.page){page=b.dataset.page;detail=null;collection=false;query='';topic='';render();}else if(b.dataset.detail){detail=[...cards,...opinions].find(c=>c.n===b.dataset.detail);render();}else if(b.dataset.reveal){revealed.has(b.dataset.reveal)?revealed.delete(b.dataset.reveal):revealed.add(b.dataset.reveal);detail?render():renderCards();}else if(b.dataset.bookmark){const c=[...cards,...opinions].find(c=>c.n===b.dataset.bookmark);c.bookmarked=!c.bookmarked;detail?render():renderCards();}else if(b.dataset.type){type=b.dataset.type;topic='';render();}else if(b.dataset.back){detail=null;collection=false;render();}else if(b.dataset.topic!==undefined){topic=b.dataset.topic;if(page==='knowledge')type='all';render();}else if(b.dataset.read){page='collections';collection=true;detail=cards[b.dataset.read==='tools'?3:0];render();}else if(b.dataset.notice||b.dataset.filter){const n=root.querySelector('#sl-notice');n.textContent=b.dataset.notice||'此处为主题设计预览，展示项目示例卡片。';n.hidden=false;}});
  root.addEventListener('input',e=>{if(e.target.id==='sl-search-input'){query=e.target.value;if(page==='collections'){root.querySelectorAll('.sl-collection').forEach(c=>c.hidden=!c.textContent.includes(query));}else renderCards();}});root.addEventListener('change',e=>{if(e.target.id==='sl-tag'||e.target.id==='sl-sort')renderCards();});root.addEventListener('keydown',e=>{if(e.target.matches('[data-read]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click();}});
  render();
  if(globalThis.Tweak){const settings={paper:'#f7eedc',texture:.16,frame:3};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--sl-paper',settings.paper);root.style.setProperty('--sl-texture',settings.texture);root.style.setProperty('--sl-frame',settings.frame+'px');}});tweak.addColorPicker(settings,'paper',{label:'纸张底色',reference:'--sl-paper'});tweak.addSlider(settings,'texture',{label:'纸张纹理',min:0,max:.3,step:.01});tweak.addSlider(settings,'frame',{label:'卡片边框',min:1,max:4,step:1,unit:'px'});}
})();
</script>
