name: 功能建议
description: 描述具体使用任务及期望的改进
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与困难
      description: 你想完成什么任务？现有功能在哪里遇到了困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的结果
      description: 描述希望如何完成任务，可以附合成示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代做法
      description: 可选。说明现有做法、可能的替代方案或取舍。
